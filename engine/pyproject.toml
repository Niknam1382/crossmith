[project]
name = "crossmith-engine"
version = "0.1.0"
description = "Crossmith core engine: project detection, build orchestration, and packaging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]
# Local AI assist (Phase 4 -- see crossmith.ai). Optional: everything in
# crossmith.ai degrades to a no-op when this isn't installed. Pinned only
# to a floor -- this project moves fast and we track it deliberately
# loosely; confirmed working against 3.0.5 as of this writing.
ai = [
    "cactus-needle>=3.0",
]
# Only for scripts/build_sidecar.py, run in CI (see .github/workflows/release.yml)
# to freeze the engine into a standalone binary for the Tauri bundle -- not
# needed for local dev, and separate from the per-project isolated build
# venvs the Nuitka/PyInstaller *backends* (packaging/) create at request time.
release = [
    "pyinstaller>=6.11",
]

[project.scripts]
crossmith-engine = "crossmith.api.main:run"

[project.entry-points."crossmith.adapters"]
python = "crossmith.adapters.python_adapter:PythonAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossmith"]

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.mypy.overrides]]
# cactus-needle (the `ai` extra, see crossmith.ai) ships no type stubs /
# py.typed marker as of 3.0.5. Only this one module touches it.
module = "needle"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real builds via Nuitka/PyInstaller (30-60s+ each). Excluded by default — run with `pytest -m slow`.",
]
addopts = "-m 'not slow'"
