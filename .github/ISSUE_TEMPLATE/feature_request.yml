name: ✨ Feature request
description: Suggest an idea, a new adapter, or an improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing a new language/framework adapter? Take a look at
        `docs/guides/adapter-development.md` first — your idea might already
        be scoped, and the template there will save you some back-and-forth.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that Crossmith doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop UI
        - Detection engine
        - Build engine / packaging
        - New language or platform adapter
        - AI assistant
        - Docs
        - Other
    validations:
      required: true
